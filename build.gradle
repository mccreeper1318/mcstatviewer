
plugins {
    id 'java'
    id 'application'
}

group 'com.example'
version '1.0.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    mainClass = 'com.example.mcstats.Main'
}

jar {
    manifest {
        attributes('Main-Class': 'com.example.mcstats.Main')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
